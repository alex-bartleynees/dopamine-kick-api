services:
  postgres:
    image: postgres:17
    container_name: postgres17
    environment:
      POSTGRES_DB: dopamine-kick-db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d dopamine-kick-db",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: alexbn
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC — apps export here
      - "4318:4318" # OTLP HTTP
    depends_on:
      - aspire-dashboard

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-dashboard
    environment:
      # Dev only — skip the browser login token.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      # Bind the OTLP receiver on all interfaces so the collector container can reach it.
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: "http://0.0.0.0:18889"
    ports:
      - "18888:18888" # Dashboard UI — http://localhost:18888

  payments-gateway:
    container_name: payments-gateway
    image: creativefree/payments-gateway
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__PaymentsDBConnectionString: "Host=postgres;Port=5432;Database=paymentsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: "Development"
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: "alexbn"
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMQ__VirtualHost: "/"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Products__dopamine-kick__PriceId: ${STRIPE_PRICEID}
      Products__dopamine-kick__SuccessUrl: "http://localhost:3000/success"
      Products__dopamine-kick__CancelUrl: "http://localhost:3000/pricing"
      Products__dopamine-kick__PortalReturnUrl: "http://localhost:3000/account"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      otel-collector:
        condition: service_started

  dotnet-web-api:
    build:
      context: .
    container_name: minimalapiapp
    image: creativefree/dopamine-kick-api:latest
    ports:
      - 5009:5009
    environment:
      ASPNETCORE_HTTP_PORTS: 5009
      ConnectionStrings__UsersDBConnectionString: "Host=postgres;Port=5432;Database=usersdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__HabitsDBConnectionString: "Host=postgres;Port=5432;Database=habitsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__QuestsDBConnectionString: "Host=postgres;Port=5432;Database=questsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__NotificationsDBConnectionString: "Host=postgres;Port=5432;Database=notificationsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__EntitlementsDBConnectionString: "Host=postgres;Port=5432;Database=entitlementsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__RedisConnection: "redis:6379"
      ConnectionStrings__OTLP_Endpoint: "http://otel-collector:4317"
      ASPNETCORE_ENVIRONMENT: "Development"
      WebPush__PrivateKey: ${VAPID_PRIVATE_KEY}
      WebPush__PublicKey: ${VAPID_PUBLIC_KEY}
      WebPush__Subject: ${VAPID_SUBJECT}
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: "alexbn"
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMQ__VirtualHost: "/"
      Keycloak__ClientSecret: ${ADMIN_CLIENT_SECRET}
      BlobStorage__ServiceUrl: "http://seaweedfs:8333"
      BlobStorage__PublicUrl: "http://localhost:8333"
      BlobStorage__BucketName: "user-profile-images"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      otel-collector:
        condition: service_started
      # seaweedfs:
      #   condition: service_healthy
      #   restart: true
    develop:
      watch:
        - action: rebuild
          path: ./
          target: /usr/app/

  product-feedback-bff:
    container_name: product-feedback-bff
    image: creativefree/product-feedback-bff:latest
    ports:
      - "5224:5224"
    environment:
      ASPNETCORE_URLS: "http://+:5224"
      ASPNETCORE_ENVIRONMENT: "Development"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "true"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ForwardedHeaders__KnownNetworks__0: "0.0.0.0/0"
      Redis__Host: "redis:6379"
      ReverseProxy__Clusters__product-feedback-api__Destinations__destination1__Address: "http://minimalapiapp:5009/"
      # Route billing traffic to the payments-gateway instead of the monolith.
      # payments-gateway now requires a {productId} path segment that the FE never sends,
      # so the PathPattern transform injects the single product's id ("dopamine-kick") on the way out.
      ReverseProxy__Routes__billing-route__Order: "-10"
      ReverseProxy__Routes__billing-route__ClusterId: "payments-gateway"
      ReverseProxy__Routes__billing-route__Match__Path: "/api/billing/{**remainder}"
      ReverseProxy__Routes__billing-route__Transforms__0__PathPattern: "/api/billing/dopamine-kick/{**remainder}"
      # The Stripe webhook isn't under the {productId} group and must pass through unmodified
      # and unauthenticated (Stripe verifies its own signature) - must be evaluated before billing-route.
      ReverseProxy__Routes__billing-webhook-route__Order: "-20"
      ReverseProxy__Routes__billing-webhook-route__ClusterId: "payments-gateway"
      ReverseProxy__Routes__billing-webhook-route__Match__Path: "/api/billing/webhook"
      ReverseProxy__Routes__billing-webhook-route__Match__Methods__0: "POST"
      ReverseProxy__Clusters__payments-gateway__Destinations__destination1__Address: "http://payments-gateway:8080/"
      KEYCLOAK_SERVER_URL: "https://identity.alexbartleynees.com"
      OpenIdConnectOptions__ClientSecret: ${CLIENT_SECRET}
      OpenIdConnectOptions__ClientId: dopamine-kick
      OpenIdConnectOptions__RedirectUri: "/dashboard"
      OpenIdConnectOptions__RequireHttpsMetadata: false
      OpenIdConnectOptions__RequireSecureCookies: false
    depends_on:
      redis:
        condition: service_healthy
        restart: true
      dotnet-web-api:
        condition: service_started
      payments-gateway:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  rabbitmq-lib:
  rabbitmq-log:
